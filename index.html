<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#064a35" />
    <meta name="description" content="A colorful Mahjong match game for a little moment of calm." />
    <title>Vita Mind — a little calm, one tile at a time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <button class="top-control" id="restart-button" type="button" aria-label="Restart this puzzle" title="Restart">↶</button>
        <div class="score-group">
          <div class="iq-display" aria-live="polite">
            <span class="iq-label">IQ</span>
            <strong id="score-value">0</strong>
            <span class="iq-feedback" id="iq-feedback" aria-hidden="true"></span>
          </div>
          <div class="record-display" aria-label="Personal bests">
            <span>Best <strong id="best-score">0</strong></span>
            <span class="record-divider" aria-hidden="true">·</span>
            <span>Level <strong id="best-level">1</strong></span>
          </div>
        </div>
        <div class="top-actions">
          <button class="top-control" id="rules-button" type="button" aria-label="How to play" title="How to play">?</button>
          <button class="top-control" id="mute-toggle" type="button" aria-label="Mute sounds" title="Sound on"><span aria-hidden="true">♫</span></button>
        </div>
      </header>

      <section class="game-content" aria-label="Mahjong matching game">
        <div class="level-line">
          <div>
            <p class="eyebrow" id="mode-label">A LITTLE MOMENT FOR YOU</p>
            <h1 id="game-title">Find your matching tiles</h1>
          </div>
          <p class="level-caption" id="level-caption">Level 1</p>
        </div>

        <section class="board-frame" aria-label="Mahjong tile board">
          <div class="board-topline">
            <span class="board-label"><span class="live-dot"></span><span id="board-message">Take your time</span></span>
            <span class="tiles-left"><strong id="remaining-value">144</strong> tiles</span>
          </div>
          <div class="board-scroll" id="board-scroll">
            <div class="board-stage" id="board-stage" role="group" aria-label="Mahjong tile board"></div>
          </div>
        </section>

      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" id="modal-close" type="button" aria-label="Close dialog">×</button>
        <span class="modal-flower" id="modal-icon" aria-hidden="true">✿</span>
        <p class="eyebrow" id="modal-eyebrow">A LITTLE GUIDE</p>
        <h2 id="modal-title">How to play</h2>
        <div class="modal-copy" id="modal-copy"></div>
        <div class="modal-actions" id="modal-actions"></div>
      </section>
    </div>
    <script src="game.js" defer></script>
  </body>
</html>
